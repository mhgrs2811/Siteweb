name: SafeCheck CI

on:
  push:
    branches: ['**']
    paths:
      - 'safecheck/**'
      - '.github/workflows/safecheck-ci.yml'
  pull_request:
    paths:
      - 'safecheck/**'
      - '.github/workflows/safecheck-ci.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profil EAS (voir safecheck/eas.json)'
        type: choice
        default: preview
        options: [development, preview, production]
      platform:
        description: 'Plateforme à construire'
        type: choice
        default: all
        options: [all, android, ios]

concurrency:
  group: safecheck-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: safecheck
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      # Le mode mock ne requiert aucune clé Supabase.
      EXPO_PUBLIC_DATA_SOURCE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: safecheck/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint & tests
        run: npm run check

  build:
    name: EAS Build
    needs: check
    # Builds sur main (profil preview) et à la demande (workflow_dispatch).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: safecheck
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EAS_PROFILE: ${{ github.event.inputs.profile || 'preview' }}
      EAS_PLATFORM: ${{ github.event.inputs.platform || 'all' }}
    steps:
      - name: Vérifier la configuration EAS
        if: env.EXPO_TOKEN == '' || env.EAS_PROJECT_ID == ''
        run: |
          echo "::warning title=EAS Build ignoré::Définir le secret EXPO_TOKEN et la variable EAS_PROJECT_ID dans Settings → Secrets and variables → Actions."
          echo "SKIP_EAS=1" >> "$GITHUB_ENV"

      - name: Checkout
        if: env.SKIP_EAS != '1'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.SKIP_EAS != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: safecheck/package-lock.json

      - name: Setup EAS CLI
        if: env.SKIP_EAS != '1'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: env.SKIP_EAS != '1'
        run: npm ci --no-audit --no-fund

      - name: Lancer le build EAS
        if: env.SKIP_EAS != '1'
        # --no-wait : le job se termine dès que le build est mis en file ; le résultat
        # se suit sur expo.dev (évite de consommer des minutes GitHub Actions).
        run: |
          echo "::notice title=EAS Build::profil=$EAS_PROFILE plateforme=$EAS_PLATFORM"
          eas build --platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive --no-wait
