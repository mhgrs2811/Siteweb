name: SafeCheck CI

on:
  push:
    branches: ['**']
    paths:
      - 'safecheck/**'
      - '.github/workflows/safecheck-ci.yml'
  pull_request:
    paths:
      - 'safecheck/**'
      - '.github/workflows/safecheck-ci.yml'

concurrency:
  group: safecheck-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: safecheck
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      # Le mode mock ne requiert aucune clé Supabase.
      EXPO_PUBLIC_DATA_SOURCE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: safecheck/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint & tests
        run: npm run check
