name: Lumé CI

on:
  push:
    paths:
      - 'lume/**'
      - '.github/workflows/lume-ci.yml'
  pull_request:
    paths:
      - 'lume/**'
      - '.github/workflows/lume-ci.yml'

concurrency:
  group: lume-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lume
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lume/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci
