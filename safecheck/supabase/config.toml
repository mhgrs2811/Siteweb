# Configuration Supabase CLI (développement local : `supabase start`).
project_id = "safecheck"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 200

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "safecheck://"
additional_redirect_urls = ["safecheck://", "exp://127.0.0.1:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Code OTP à 6 chiffres : plus simple qu'un lien magique pour les publics peu à l'aise.
otp_length = 6
otp_expiry = 600

[edge_runtime]
enabled = true
